[package]
name = "rtop"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A fast, elegant terminal system monitor written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/summertools/rtop"
keywords = ["tui", "monitor", "system", "terminal", "btop"]
categories = ["command-line-utilities", "visualization"]

[lib]
name = "rtop"
path = "src/lib.rs"

[[bin]]
name = "rtop"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"] }
dirs = "6.0.0"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.3.18"
sysinfo = "0.35.2"
toml = "0.8.23"
unicode-width = "0.2.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
assert_is_empty = "allow"
