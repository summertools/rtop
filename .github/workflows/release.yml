name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: btop-rs-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: btop-rs-macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: btop-rs-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: btop-rs-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/btop-rs" dist/btop-rs
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" btop-rs
          rm dist/btop-rs

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/btop-rs.exe" "dist/btop-rs.exe"
          Compress-Archive -Path "dist/btop-rs.exe" -DestinationPath "dist/${{ matrix.artifact }}.zip"
          Remove-Item "dist/btop-rs.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
